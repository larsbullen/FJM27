<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>FJM27</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f3ef; --surface:#fcfcfb; --surface-2:#efeee9; --line:#dedcd5; --grid:#e7e5df;
  --text:#0b0b0b; --text-2:#4a4945; --text-3:#66655f;
  --accent:#2a78d6; --accent-soft:#e3eefb; --link:#1f66bd;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4; --ref:#52514e; --sec-climb:#ebe8e0; --sec-descent:#f6f5f1; --sec-rolling:#f1efe9;
  --dv-d3:#184f95; --dv-d2:#3987e5; --dv-d1:#9ec5f4; --dv-0:#e0dfda; --dv-u1:#f2b0ae; --dv-u2:#e66767; --dv-u3:#a8302f;
  --band:#d9d7cf; --band-edge:#8c897f;
  --ph-1:#86b6ef; --ph-2:#5598e7; --ph-3:#2a78d6; --ph-4:#1c5cab; --ph-5:#104281;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --good-text:#006300;
  --today:#fff7e0; --today-edge:#a87000;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#222220; --line:#33332f; --grid:#2a2a27;
    --text:#ffffff; --text-2:#cfcec4; --text-3:#a9a89f;
    --accent:#3987e5; --accent-soft:#1d2a3a; --link:#6aa6ee;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --ref:#c3c2b7; --sec-climb:#2a2a27; --sec-descent:#1e1e1c; --sec-rolling:#242422;
    --dv-d3:#86b6ef; --dv-d2:#3987e5; --dv-d1:#1c5cab; --dv-0:#45453f; --dv-u1:#8a3a39; --dv-u2:#e66767; --dv-u3:#f2b0ae;
    --band:#3a3a36; --band-edge:#86857c;
    --ph-1:#86b6ef; --ph-2:#5598e7; --ph-3:#3987e5; --ph-4:#256abf; --ph-5:#1c5cab;
    --good-text:#5fd35f;
    --today:#2b2615; --today-edge:#c98500;
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#222220; --line:#33332f; --grid:#2a2a27;
    --text:#ffffff; --text-2:#cfcec4; --text-3:#a9a89f;
    --accent:#3987e5; --accent-soft:#1d2a3a; --link:#6aa6ee;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --ref:#c3c2b7; --sec-climb:#2a2a27; --sec-descent:#1e1e1c; --sec-rolling:#242422;
    --dv-d3:#86b6ef; --dv-d2:#3987e5; --dv-d1:#1c5cab; --dv-0:#45453f; --dv-u1:#8a3a39; --dv-u2:#e66767; --dv-u3:#f2b0ae;
    --band:#3a3a36; --band-edge:#86857c;
    --ph-1:#86b6ef; --ph-2:#5598e7; --ph-3:#3987e5; --ph-4:#256abf; --ph-5:#1c5cab;
    --good-text:#5fd35f;
    --today:#2b2615; --today-edge:#c98500;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:780px;margin:0 auto;padding:16px 16px 64px}
h1{font-size:30px;letter-spacing:-.02em;margin:0;line-height:1.1}
h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:14px;margin:0 0 6px}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--line);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--text);border-color:transparent}
.pill .dot{width:8px;height:8px;border-radius:50%}
.phasebar{position:relative;margin:18px 0 4px}
.phasebar .segs{display:flex;gap:2px;height:10px}
.phasebar .seg{border-radius:3px;height:100%}
.phasebar .labels{display:flex;gap:2px;margin-top:6px}
.phasebar .labels div{font-size:12px;color:var(--text-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.aidsw{display:inline-block;width:9px;height:9px;border:2px solid var(--text);border-radius:2px;background:var(--surface);margin-right:5px;vertical-align:-1px}
.aidrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.aid{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.day .done{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--good-text, var(--text))}
.day .none{display:block;margin-top:3px;font-size:12px;color:var(--text-3, var(--text-2));font-style:italic}
.panelwrap .fulltxt{margin:8px 0 4px;font-size:13px;font-weight:600}
.panelwrap > .alt{margin:0 0 4px;font-size:12px}
.phasebar .phhits{position:absolute;left:0;right:0;top:-6px;bottom:-2px;display:flex;gap:2px}
.phasebar .phhit{all:unset;cursor:pointer;border-radius:6px}
.phasebar .phhit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.phasebar.hov .seg{opacity:.35;transition:opacity .12s}
.phasebar.hov .seg.on{opacity:1}
.phasebar .marker{position:absolute;top:-16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.phasebar .marker span{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap}
.phasebar .marker i{width:2px;height:20px;background:var(--text);border-radius:1px}
/* week card */
.wkhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.wkhead button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface-2);font-size:20px;color:var(--text)}
.wkhead button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wkhead button:disabled{opacity:.35;cursor:default}
#wktitle:focus{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wkhead .t{text-align:center;flex:1}
.wkhead .t b{display:block;font-size:16px}
.days{display:flex;flex-direction:column;gap:6px}
.day{display:block;padding:0;border-radius:10px;border:1px solid transparent;background:var(--surface-2)}
details.sess{border-top:0}
.day>summary{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 10px;cursor:pointer;list-style:none;border-radius:10px}
.day>summary::-webkit-details-marker,.sess>summary::-webkit-details-marker{display:none}
.day>summary:focus-visible,.sess>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.more{display:block;margin-top:4px;font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.02em}
.more i{display:inline-block;font-style:normal;transition:transform .15s}
details[open]>summary .more{color:var(--text-2)}
details[open]>summary .more i{transform:rotate(90deg)}
.dpanel{padding:2px 12px 12px 72px;font-size:13px;line-height:1.45}
.dpanel ul{margin:0 0 6px;padding-left:18px}.dpanel li{margin:2px 0}
.dpanel .dl{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:5px}
.dpanel .dl b{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);padding-top:2px;min-width:52px}
.dpanel .dpart{margin-bottom:8px}.dpanel .dt{font-weight:650;margin:2px 0 3px}
@media (max-width:480px){.dpanel{padding-left:12px}}
.sess .dpanel{padding:0 0 8px 46px}
@media (max-width:480px){.sess .dpanel{padding-left:4px}}
.day .d{font-weight:600;font-size:13px;line-height:1.2}
.day .d small{display:block;font-weight:400;color:var(--text-3);font-size:12px}
.day .s{font-size:14px}
.day.today{background:var(--today);border-color:var(--today-edge)}
.day.today .d::after{content:"Today";display:block;font-size:12px;font-weight:700;color:var(--text);margin-top:3px;letter-spacing:.04em;text-transform:uppercase}
.day.past{background:transparent;border-color:var(--line)}
.focus{margin:0 0 10px;font-size:14px}
.backnow{font-size:12px;text-align:center;margin-top:8px}

/* chart */
.chartwrap{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--text-2);font-size:12px;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text-2);margin:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px}
.sw.line{height:2px;border-radius:1px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.15);border-radius:10px;padding:8px 10px;font-size:12px;min-width:170px;max-width:240px;z-index:5;display:none}
.tip b{font-size:13px}
.tip .r{display:flex;justify-content:space-between;gap:12px}
.tip .k{display:inline-flex;align-items:center;gap:6px;color:var(--text-2)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:var(--surface-2);border-radius:12px;padding:12px}
.tile .v{font-size:22px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--text-2);font-weight:600;line-height:1.3}
.tile .sub{font-size:12px;color:var(--text-2);margin-top:2px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.status svg{flex:none}
.ctrls{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.ctrls .seg3{flex:1 1 220px;margin:0}
.cmp{display:inline-flex;align-items:center;gap:6px}
.cmp select{font:inherit;font-size:13px;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:190px}
.morebtn{all:unset;cursor:pointer;font-size:13px;color:var(--link);margin-top:8px;display:inline-block}
tr.fjm td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.cchip{display:inline-block;font-size:12px;font-weight:600;padding:0 6px;margin-left:6px;border-radius:6px;background:var(--accent-soft);color:var(--text);white-space:nowrap;vertical-align:1px}
.gbar{display:flex;gap:2px;height:12px;margin:12px 0 6px}.gbar span{border-radius:3px;min-width:2px}
.glabels{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--text-2)}.glabels span{display:inline-flex;align-items:center;gap:5px}.glabels b{color:var(--text)}
.ctab td{font-size:13px}.ctab .small{margin-top:2px}
.secno{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:12px;font-weight:700;border:1px solid var(--band-edge)}
.secno.k-climb{background:var(--sec-climb)}.secno.k-descent{background:var(--sec-descent)}.secno.k-rolling{background:var(--sec-rolling)}
.seg3{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:0 0 10px}
.seg3 button{all:unset;cursor:pointer;flex:1;text-align:center;font-size:13px;padding:7px 4px;border-radius:7px;color:var(--text-2)}
.seg3 button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg3 button:focus-visible{outline:2px solid var(--accent)}
.seg3 .sht{display:none}
@media (max-width:420px){.seg3 .lng{display:none}.seg3 .sht{display:inline}}
.sw.ref{background:repeating-linear-gradient(90deg,var(--ref) 0 5px,transparent 5px 8px)}
.tbl{border:0;margin-top:6px}.tbl summary{padding:4px 0;color:var(--text-2)}.tbl table{font-size:12px}
.tile.wide{grid-column:1/-1}
.hbreak{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}.hbreak span{display:inline-flex;align-items:center;gap:4px}.hbreak .sw{width:8px;height:8px}
.alt{display:block;font-size:12px;color:var(--text-2);margin-top:2px}
.xt td:first-child{font-weight:600}
.sync{font-size:12px;color:var(--text-3);margin-top:10px}
/* checkpoints */
.cps{list-style:none;margin:0;padding:0;position:relative}
.cps li{position:relative;padding:0 0 14px 26px}
.cps li::before{content:"";position:absolute;left:7px;top:6px;bottom:-6px;width:2px;background:var(--line)}
.cps li:last-child::before{display:none}
.cps .dot{position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);background:var(--surface)}
.cps li.past .dot{background:var(--accent)}
.cps li.next .dot{box-shadow:0 0 0 4px var(--accent-soft)}
.cps .when{font-size:12px;color:var(--text-2)}
/* plan accordion */
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{cursor:pointer;list-style:none;padding:10px 0}
summary::-webkit-details-marker{display:none}
summary .chev{display:inline-block;transition:transform .15s;color:var(--text-3);margin-right:6px}
details[open]>summary .chev{transform:rotate(90deg)}
.phase>summary{font-weight:650}
.wk{border-top:1px solid var(--grid);margin-left:4px}
.wk>summary{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:8px 0;font-size:14px}
.wk>summary .km{font-variant-numeric:tabular-nums;color:var(--text-2);font-size:13px;white-space:nowrap;text-align:right}
.wk>summary>span{min-width:0}
.wk .tag{display:inline-block;margin:2px 0 2px 6px}
@media (max-width:480px){.wk>summary{grid-template-columns:auto minmax(0,1fr)}.wk>summary .km{grid-column:2;text-align:left;white-space:normal}}
.wk.cur>summary{font-weight:650}
.wk .body{padding:0 0 10px 20px}
.wk .body .sess>summary{display:grid;grid-template-columns:38px 1fr;gap:8px;font-size:13px;padding:4px 0;cursor:pointer;list-style:none}
.wk .body .sess b{color:var(--text-2);font-weight:600}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--text-2);margin-left:6px;font-weight:600;vertical-align:1px}
.tag.now{background:var(--today);color:var(--text);border:1px solid var(--today-edge)}
/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--grid);vertical-align:top}
th{font-size:12px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.pb td{font-weight:650}
.gymgrid{display:grid;gap:10px}
.gym{background:var(--surface-2);border-radius:12px;padding:12px;border:1px solid transparent}
.gym.cur{border-color:var(--accent)}
.gym p{margin:4px 0;font-size:13px}
.gym .ab{font-size:13px;margin-top:6px}
.gym .ab b{display:inline-block;min-width:16px}
ul.tight{margin:6px 0 0;padding-left:18px}
ul.tight li{margin:3px 0;font-size:14px}
.goalnum{font-size:30px;font-weight:700;letter-spacing:-.02em}
.foot{font-size:12px;color:var(--text-3);text-align:center;margin-top:20px}
.themebtn{all:unset;cursor:pointer;font-size:12px;color:var(--text-2);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
/* ---- layout round: header, nav, today, measures ---- */
html{overflow-x:clip}
[hidden]{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
main{min-width:0}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.tablewrap table{min-width:100%}
.ytab{min-width:560px}
.racehead{padding:4px 2px 10px}
.rh-main{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.brand{font-weight:800;font-size:15px;letter-spacing:.02em}
.rh-race{font-size:14px;color:var(--text-2)}
.rh-sub{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:14px;color:var(--text-2);margin-top:2px}
.rh-sub b{color:var(--text)}
.rh-count{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.topnav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:4px;margin:0 -16px 14px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.topnav a{flex:none;font-size:14px;font-weight:600;color:var(--text-2);text-decoration:none;padding:7px 10px;border-radius:8px;white-space:nowrap}
.topnav a[aria-current]{color:var(--text);background:var(--surface-2)}
.topnav a:focus-visible,.themebtn:focus-visible,.linkbtn:focus-visible,.morebtn:focus-visible,.cmp select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topnav .themebtn{margin-left:auto;flex:none;font-size:15px;padding:5px 10px}
.group{scroll-margin-top:60px;margin-bottom:22px}
.grouph{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-2);margin:6px 2px 10px;font-weight:700}
.todaycard{border:2px solid var(--today-edge);background:linear-gradient(var(--today),var(--today)) top/100% 0 no-repeat,var(--surface)}
.tlab{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--today);border:1px solid var(--today-edge);border-radius:6px;padding:1px 8px;color:var(--text)}
.tttl{font-size:22px;line-height:1.25;margin:8px 0 4px;letter-spacing:-.01em}
.tmeta{font-weight:500;color:var(--text-2);font-size:17px}
.topt{margin:0 0 6px;font-size:15px;color:var(--text-2)}
.todaycard .done,.todaycard .none{display:block;font-size:14px;margin:4px 0}
.todaycard .done{font-weight:600;color:var(--good-text)}
.thow{font-size:15px;line-height:1.5;margin-top:8px}
.thow ul{margin:4px 0 8px;padding-left:20px}.thow li{margin:3px 0}
.thow .dl,.tmore .dl{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:6px;font-size:14px}
.thow .dl b,.tmore .dl b{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);padding-top:2px;min-width:56px}
.thow .dt{font-weight:700;margin:8px 0 2px}
.tmore{border-top:1px solid var(--line);margin-top:10px}
.tmore>summary{font-size:14px;font-weight:600;color:var(--text-2);padding:10px 0 4px}
.tmore .dpanel{padding:0 0 4px}
.chgfrom{margin:8px 0 4px;font-size:13px;color:var(--text-2);font-style:italic}
.wkphase{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);font-weight:600}
.wkphase .dot{width:8px;height:8px;border-radius:50%}
.wkfocus{font-size:18px;font-weight:650;line-height:1.3;margin:4px 0 6px;letter-spacing:-.01em}
.wkctx{font-size:14px;margin:0 0 10px;padding:6px 10px;border-left:3px solid var(--today-edge);background:var(--surface-2);border-radius:0 8px 8px 0}
.meas{display:grid;gap:12px;margin:12px 0 4px}
.meas.compact{gap:10px;margin:0}
.m .mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.m .ml{font-size:14px;font-weight:600}
.m .mv{font-size:15px;font-variant-numeric:tabular-nums}
.m .ms{font-size:13px;color:var(--text-2);margin-left:4px}
.m .ms.warn{color:var(--text);font-weight:600}
.m .ms.warn::before{content:"▲ ";color:var(--warning);font-size:10px}
.mbar{position:relative;height:14px;border-radius:4px;background:var(--surface);margin:6px 0 4px;overflow:hidden;border:1px solid var(--band-edge)}
.mbar .band{position:absolute;top:0;bottom:0;background:var(--band);border-left:1px solid var(--band-edge);border-right:1px solid var(--band-edge)}
.mbar .band.rev{background:transparent;border:2px dashed var(--text);border-radius:3px;top:0;bottom:0}
.mbar .fill{position:absolute;left:0;top:3px;bottom:3px;background:var(--series-1);border-radius:0 3px 3px 0}
.mt{font-size:13px;color:var(--text-2)}
.longr{margin-top:2px}
.dayshead{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);margin:16px 0 8px}
.day .ttl{font-size:16px;font-weight:650;line-height:1.3}
.day .dmeta{display:block;font-size:13px;color:var(--text-2);margin-top:1px}
.day .s{min-width:0;overflow-wrap:anywhere}
.linkbtn{all:unset;cursor:pointer;color:var(--link);font-size:13px;text-decoration:underline}
.revsw{background:transparent;border:1.5px dashed var(--text);box-sizing:border-box}
.cursw{background:var(--today);border:1px solid var(--today-edge);box-sizing:border-box}
.ctrls .winsw{flex:0 1 190px}
.raceline{margin:-4px 0 10px;color:var(--text-2);font-size:14px}
.cmp select{min-height:34px}
.secblocks{display:none;margin-top:12px}
.secb{border-top:1px solid var(--grid);padding:10px 0;display:grid;gap:3px}
.secb-h{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2)}
.secb-clock{margin-left:auto}.secb-clock b{color:var(--text)}
@media (max-width:559px){.secblocks{display:block}.ctabwrap{display:none}}
.phlegend{display:none;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:13px;color:var(--text)}
.phlegend span{display:inline-flex;align-items:center;gap:5px}
.phlegend .dot{width:9px;height:9px;border-radius:50%}
@media (max-width:480px){.phasebar .labels{display:none}.phlegend{display:flex}}
tr.curwk td{background:var(--today)}
</style>

  warning: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1l7.5 13.5h-15z" fill="var(--warning)"/><path d="M8 6v4" stroke="#1a1a19" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="12.2" r="1.1" fill="#1a1a19"/></svg>',
  serious: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="var(--serious)"/><path d="M8 4v5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="11.8" r="1.1" fill="#fff"/></svg>',
  info: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="var(--text-2)" stroke-width="1.6"/><path d="M8 7v4.5" stroke="var(--text-2)" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="4.6" r="1" fill="var(--text-2)"/></svg>'
};

/* ---------- sections ---------- */
/* ---------- targets: ONE source for every summary ---------- */
function weekTargets(w){
  if (!w) return null;
  const o = {km:[w.kmLo, w.kmHi], vert:[w.vertLo, w.vertHi], hours:[w.hoursLo, w.hoursHi], longRun:w.longRun};
  const R = w.revised;
  const r = R ? {km:R.km || o.km, vert:R.vert || o.vert, hours:R.hours || o.hours, longRun:R.longRun || o.longRun, note:R.note || ""} : null;
  return {orig:o, rev:r, eff:r || o};
}
const weekState = i => i < curIdxRaw ? "past" : i === curIdxRaw ? "current" : "future";
const MEAS = [
  {k:"km",    label:"Running distance",   short:"Run km",    scope:"runs only",                 unit:"km", done:a => num(a.runKm), f:v => v.toFixed(1), r:v => String(v)},
  {k:"vert",  label:"Running elevation",   short:"Run elev.", scope:"runs only",                 unit:"m",  done:a => num(a.runElev),      f:v => fM(v),       r:v => fM(v)},
  {k:"hours", label:"Training time",      short:"Time", scope:"run + ski + bike, excl. strength", unit:"h", done:a => totH(a), f:v => fH(v), r:v => String(v)}
];
function measuresHtml(w, i, compact){
  const T = weekTargets(w), a = actualBy[w.wk], st = weekState(i);
  return `<div class="meas ${compact ? "compact" : ""}">${MEAS.map(M => {
    const done = a ? M.done(a) : 0, [lo, hi] = T.orig[M.k], rv = T.rev ? T.rev[M.k] : null, [elo, ehi] = (rv || [lo, hi]);
    const max = Math.max(hi, rv ? rv[1] : 0, done) * 1.15 || 1, pc = v => (Math.min(v, max) / max * 100).toFixed(1);
    let state = "";
    if (done > ehi) state = "above range";
    else if (st === "past") state = done < elo ? "below range" : "in range";
    else if (st === "current") state = done >= elo ? "so far · in range" : "so far";
    const skin = M.k === "vert" && a && num(a.bcElev) > 0 ? `<div class="mt">+ ${fM(num(a.bcElev))} m skinning (not counted)</div>` : "";
    const right = st === "future" && !a ? `<span class="mv"><b>Planned</b></span>`
      : `<span class="mv">Completed <b>${M.f(done)} ${M.unit}</b> ${state ? `<span class="ms ${state === "above range" ? "warn" : ""}">${state}</span>` : ""}</span>`;
    return `<div class="m">
      <div class="mh"><span class="ml">${M.label}</span>${right}</div>
      <div class="mbar" aria-hidden="true"><span class="band" style="left:${pc(lo)}%;width:${(pc(hi) - pc(lo)).toFixed(1)}%"></span>${rv ? `<span class="band rev" style="left:${pc(rv[0])}%;width:${(pc(rv[1]) - pc(rv[0])).toFixed(1)}%"></span>` : ""}${a ? `<span class="fill" style="width:${pc(done)}%"></span>` : ""}</div>
      <div class="mt">Planned ${M.r(lo)}–${M.r(hi)} ${M.unit}${rv ? ` · <b>revised ${M.r(rv[0])}–${M.r(rv[1])} ${M.unit}</b>` : ""} <span class="faint">· ${M.scope}</span></div>${skin}
    </div>`; }).join("")}
    ${!compact ? `<div class="mt longr">Long run: planned ${esc(T.orig.longRun)}${T.rev && T.rev.longRun !== T.orig.longRun ? ` · <b>revised ${esc(T.rev.longRun)}</b>` : ""}${a && num(a.longKm) ? ` · longest this week <b>${num(a.longKm).toFixed(1)} km</b>` : ""}</div>` : ""}
  </div>`;
}

/* ---------- race header + nav ---------- */
function raceHeader(){
  const r = P.race, g = P.goal;
  const goal = g.target.replace(" on the race clock", "").trim();
  return `<header class="racehead">
    <div class="rh-main"><span class="brand">FJM27</span><span class="rh-race">${esc(r.name)} · Sat ${esc(fmtY(parseD(r.date)))}, ${esc(r.start)}</span></div>
    <div class="rh-sub"><span>Goal <b>${esc(goal)}</b> · beat 4:26</span><span class="rh-count" id="count"></span></div>
  </header>
  <nav class="topnav" aria-label="Sections"><a href="#thisweek">This week</a><a href="#progress">Progress</a><a href="#plan">Plan</a><a href="#race">Race</a><button class="themebtn" id="themebtn" type="button" aria-label="Toggle light/dark theme">◐</button></nav>`;
}
// ONE day-difference helper (calendar days, DST-safe) — used by the header and checkpoints
const daysUntil = isoStr => { const [y,m,d] = isoStr.split("-").map(Number); return Math.round((Date.UTC(y, m-1, d) - Date.UTC(today.getFullYear(), today.getMonth(), today.getDate())) / DAY); };
function tickCount(){
  const el = document.getElementById("count"); if (!el) return;
  const n = daysUntil(P.race.date);
  el.textContent = n < 0 ? "Race done" : n === 0 ? "Race day" : `${n} day${n === 1 ? "" : "s"} to go`;
}
function phaseBar(){
  const w = W[curIdx], total = W.length;
  const counts = P.phases.map(p => W.filter(x => x.phase === p.name).length);
  const frac = Math.max(0, Math.min(1, ((today - start) / DAY) / (total * 7)));
  const before = curIdxRaw < 0, after = curIdxRaw >= total;
  return `<div class="phasebar" role="group" aria-label="Plan progress: ${esc(w.phase)}, week ${w.n} of ${total-1}">
      <div class="marker" style="left:${(frac*100).toFixed(2)}%;${frac < .1 ? "transform:translateX(-1px);align-items:flex-start" : frac > .9 ? "transform:translateX(calc(-100% + 1px));align-items:flex-end" : ""}"><span>${before ? "Starts soon" : after ? "Done" : `Week ${w.n} of ${total-1}`}</span><i></i></div>
      <div class="segs" style="margin-top:22px">${P.phases.map((p,i) => `<div class="seg" data-ph="${i}" style="flex:${counts[i]};background:${phColor(i)}"></div>`).join("")}</div>
      <div class="labels">${P.phases.map((p,i) => `<div style="flex:${counts[i]}">${esc(p.name)}</div>`).join("")}</div>
      <div class="phlegend">${P.phases.map((p,i) => `<span><i class="dot" style="background:${phColor(i)}"></i>${esc(p.name)} <span class="faint">${esc(fmt(parseD(p.from)))}</span></span>`).join("")}</div>
      <div class="phhits">${P.phases.map((p,i) => `<button type="button" class="phhit" data-ph="${i}" style="flex:${counts[i]}" aria-label="${esc(p.name)}: ${esc(fmtY(parseD(p.from)))} to ${esc(fmtY(parseD(p.to)))}"></button>`).join("")}</div>
      <div class="tip" id="phtip"></div>
    </div>`;
}

/* ---------- day helpers ---------- */
const isoD = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const actsOn = iso => (S && S.acts ? S.acts.filter(a => a.d === iso) : []);
const ACT_NAMES = {Run:"Run", TrailRun:"Trail run", GravelRide:"Gravel ride", Ride:"Ride", VirtualRide:"Zwift", BackcountrySki:"BC ski", NordicSki:"XC ski", AlpineSki:"Alpine ski", WeightTraining:"Strength", Workout:"Workout", Hike:"Hike", Walk:"Walk"};
function actLabel(a){
  const nm = a.tr && /Ride/.test(a.s) ? "Zwift" : (ACT_NAMES[a.s] || a.s);
  const dur = a.min >= 60 ? `${Math.floor(a.min/60)}:${String(a.min%60).padStart(2,"0")}` : `${a.min}'`;
  const dist = a.km >= 0.5 && !/Weight|Workout/.test(a.s) ? ` ${a.km.toFixed(1)} km` : "";
  return `${nm}${dist} · ${dur}${a.up >= 20 ? ` · +${fM(a.up)} m` : ""}`;
}
const list = a => a && a.length ? `<ul>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
const drow = (lab, v) => v ? `<div class="dl"><b>${lab}</b><span>${esc(v)}</span></div>` : "";
function howHtml(d){
  return d.parts ? d.parts.map(p => `<div class="dpart"><div class="dt">${esc(p.title)}</div>${list(p.how)}${drow("Targets", p.targets)}</div>`).join("")
                 : `${list(d.how)}${drow("Targets", d.targets)}`;
}
const whyHtml = d => `${drow("Why", d.why)}${drow("Fuel", d.fuel)}${drow("Tips", d.tips)}${drow("If short on time", d.if)}`;
function detailHtml(d){ return `<div class="dpanel">${howHtml(d)}${whyHtml(d)}</div>`; }

const shortOf = (w,k) => (w.sessionsShort && w.sessionsShort[k]) || w.sessions[k];
const changedFrom = (w,k) => w.changed && w.changed[k] && w.originalShort && w.originalShort[k] ? w.originalShort[k] : "";
function fullPanel(w,k){
  const full = w.sessions[k], sh = shortOf(w,k), det = w.sessionsDetail && w.sessionsDetail[k], cf = changedFrom(w,k);
  const head = (cf ? `<p class="chgfrom">Changed from: ${esc(cf)}</p>` : "")
    + (full !== sh ? `<p class="fulltxt">${esc(full)}</p>` : "")
    + (w.sessionsAlt && w.sessionsAlt[k] ? `<p class="alt">Alt: ${esc(w.sessionsAlt[k])}</p>` : "");
  return `<div class="panelwrap">${head}${det ? detailHtml(det) : ""}</div>`;
}
const isRest = (w,k) => /^rest\b/i.test(w.sessions[k]) || /^rest\b/i.test(shortOf(w,k));
const metaLine = (w,k) => { const t = shortOf(w,k).toLowerCase(), dur = w.sessionsDur && w.sessionsDur[k], wh = w.sessionsWhen && w.sessionsWhen[k];
  const durNum = dur ? dur.replace(/\s*(min|h)$/, "") : "";
  return [dur && !t.includes(durNum) ? dur : "", wh && !t.includes(wh.toLowerCase()) ? wh : ""].filter(Boolean); };
function doneLine(dd){
  const iso = isoD(dd), done = actsOn(iso);
  return done.length ? `<span class="done">✓ ${done.map(actLabel).map(esc).join(" · ")}</span>`
    : (dd < today && S && S.acts && iso <= String(S.updated || "").slice(0,10) ? `<span class="none">Nothing logged in Strava</span>` : "");
}

/* ---------- TODAY ---------- */
function todayCard(){
  let i = curIdxRaw, k = KEYS[todayDow], lab = "Today", dd = today;
  if (i < 0 || i >= W.length) {               // outside the plan: next session
    if (i >= W.length) return `<section class="card todaycard"><div class="tlab">After the race</div><h2 class="tttl">Recover. Plan the next one.</h2></section>`;
    i = 0; const w0 = W[0]; let j = KEYS.findIndex(x => !isRest(w0, x)); if (j < 0) j = 0;
    k = KEYS[j]; dd = addDays(start, j); lab = `Next — ${DOW[j]} ${fmt(dd)}`;
  }
  const w = W[i], det = w.sessionsDetail && w.sessionsDetail[k], rest = isRest(w,k);
  const sh = shortOf(w,k), opt = rest && / or /i.test(sh) ? sh.split(/ or /i).slice(1).join(" or ") : "";
  const title = rest ? "Rest" : sh, meta = rest ? [] : metaLine(w,k);
  const cf = changedFrom(w,k);
  const more = det ? whyHtml(det) : "";
  const extra = (cf ? `<p class="chgfrom">Changed from: ${esc(cf)}</p>` : "")
    + (w.sessions[k] !== sh ? `<p class="fulltxt">${esc(w.sessions[k])}</p>` : "")
    + (w.sessionsAlt && w.sessionsAlt[k] ? `<p class="alt">Alt: ${esc(w.sessionsAlt[k])}</p>` : "");
  return `<section class="card todaycard" aria-labelledby="todayttl">
    <div class="tlab">${esc(lab)} · ${DOW[(dd.getDay()+6)%7]} ${esc(fmt(dd))}</div>
    <h2 class="tttl" id="todayttl">${esc(title)}${meta.length ? `<span class="tmeta"> · ${meta.map(esc).join(" · ")}</span>` : ""}</h2>
    ${opt ? `<p class="topt">Optional: ${esc(opt)}</p>` : ""}
    ${doneLine(dd)}
    ${w.sessionsCourse && w.sessionsCourse[k] ? `<span class="cchip">→ ${esc(w.sessionsCourse[k])}</span>` : ""}
    ${det && !rest ? `<div class="thow">${howHtml(det)}</div>` : ""}
    ${(more || extra) ? `<details class="tmore"><summary><span class="chev">›</span>Why, fuel &amp; options</summary><div class="dpanel">${extra}${rest && det ? howHtml(det) : ""}${more}</div></details>` : ""}
  </section>`;
}

/* ---------- THIS WEEK ---------- */
let viewIdx = curIdx;
function weekCard(){ return `<section class="card" id="weekcard" aria-label="Week schedule"></section>`; }
function renderWeek(){
  const el = document.getElementById("weekcard"); const w = W[viewIdx];
  const mon = parseD(w.wk), sun = addDays(mon, 6);
  const isCur = viewIdx === curIdxRaw, T = weekTargets(w);
  const ctx = T.rev && T.rev.note ? T.rev.note : (w.changed && Object.keys(w.changed).length ? "Some sessions changed — see each day's details" : "");
  el.innerHTML = `
    <div class="wkhead">
      <button type="button" id="prevwk" aria-label="Previous week" ${viewIdx === 0 ? "disabled" : ""}>‹</button>
      <div class="t"><span class="small muted">${isCur ? "This week" : viewIdx < curIdxRaw ? "Past week" : "Upcoming week"}</span><b id="wktitle" tabindex="-1">Week ${w.n} · ${fmt(mon)} – ${fmt(sun)}</b></div>
      <button type="button" id="nextwk" aria-label="Next week" ${viewIdx === W.length-1 ? "disabled" : ""}>›</button>
    </div>
    <div class="wkphase"><span class="dot" style="background:${phColor(phaseIdx(w.phase))}"></span>${esc(w.phase)} phase${w.deload ? (w.revised ? " · planned as a recovery week" : " · deload week") : ""}</div>
    <p class="wkfocus">${esc(w.focus)}</p>
    ${ctx ? `<p class="wkctx">${esc(ctx)}</p>` : ""}
    ${measuresHtml(w, viewIdx, false)}
    <h3 class="dayshead">Schedule</h3>
    <div class="days">${KEYS.map((k,i) => {
      const dd = addDays(mon, i);
      const cls = isCur && i === todayDow ? "today" : (dd < today ? "past" : "");
      const meta = isRest(w,k) ? [] : metaLine(w,k);
      return `<details class="day ${cls}"><summary><div class="d">${DOW[i]}<small>${fmt(dd)}</small></div><div class="s"><b class="ttl">${esc(actsOn(isoD(dd)).length ? shortOf(w,k).replace(/\s*✓$/, "") : shortOf(w,k))}</b>${meta.length ? `<span class="dmeta">${meta.map(esc).join(" · ")}</span>` : ""}${doneLine(dd)}${w.sessionsCourse && w.sessionsCourse[k] ? `<span class="cchip">→ ${esc(w.sessionsCourse[k])}</span>` : ""}<span class="more" aria-hidden="true">Details <i>›</i></span></div></summary>${fullPanel(w,k)}</details>`;
    }).join("")}</div>
    ${viewIdx !== curIdx ? `<div class="backnow"><button type="button" class="linkbtn" id="backnow">Back to this week</button></div>` : ""}`;
  const announce = () => { const lv = document.getElementById("live"); if (lv) lv.textContent = document.getElementById("wktitle").textContent; };
  const step = (d, id) => { viewIdx += d; renderWeek(); announce(); const b = document.getElementById(id); (b && !b.disabled ? b : document.getElementById("wktitle")).focus(); };
  document.getElementById("prevwk").onclick = () => { if (viewIdx > 0) step(-1, "prevwk"); };
  document.getElementById("nextwk").onclick = () => { if (viewIdx < W.length-1) step(1, "nextwk"); };
  const b = document.getElementById("backnow"); if (b) b.onclick = () => { viewIdx = curIdx; renderWeek(); announce(); document.getElementById("wktitle").focus(); };
}

const METRICS = {
  km:    {label:"Running km",   unit:"km", lo:w => w.kmLo,    hi:w => w.kmHi,    cap:80,   step:20,
          parts:a => [{k:"run", label:"Run", v:num(a.runKm), c:"var(--series-1)"}], ref:r => num(r.runKm), fmt:v => v.toFixed(1)+" km"},
  vert:  {label:"Running elevation", unit:"m",  lo:w => w.vertLo,  hi:w => w.vertHi,  cap:3000, step:500,
          parts:a => VTYPES.map(t => ({k:t.k, label:t.label, v:t.v(a), c:t.c})), ref:r => num(r.runElev), fmt:v => "+"+fM(v)+" m"},
  hours: {label:"Training time",    unit:"h",  lo:w => w.hoursLo, hi:w => w.hoursHi, cap:16,   step:2,
          parts:a => TYPES.map(t => ({k:t.k, label:t.label, v:t.h(a), c:t.c})), ref:r => totH(r), fmt:v => fH(v)+" h"}
};
let metric = "km";
try { const m = localStorage.getItem("fjm27-metric"); if (METRICS[m]) metric = m; } catch(e){}
let win = "recent";
try { const v = localStorage.getItem("fjm27-win"); if (v === "full" || v === "recent") win = v; } catch(e){}

function progress(){
  const w = W[curIdx];
  return `<section class="card">
      <h2>Plan progress</h2>
      ${phaseBar()}
    </section>
    <section class="card" id="totalscard">
      <div class="spread"><h2>This week so far</h2><span class="small muted">Week ${w.n} · completed vs target</span></div>
      ${measuresHtml(w, curIdx, true)}
    </section>
    <section class="card" id="chartcard">
    <div class="spread"><h2>Where I am</h2></div>
    <div class="ctrls">
      <div class="seg3" id="metricsw" role="group" aria-label="Metric">${MEAS.map(M => `<button type="button" data-m="${M.k}" aria-pressed="${M.k===metric}"><span class="lng">${M.label}</span><span class="sht">${M.short}</span></button>`).join("")}</div>
      <div class="seg3 winsw" id="winsw" role="group" aria-label="Time window"><button type="button" data-w="recent" aria-pressed="${win==="recent"}">Recent</button><button type="button" data-w="full" aria-pressed="${win==="full"}">Full plan</button></div>
      ${CMP_YEARS.length ? `<label class="cmp"><span class="small muted">Compare</span><select id="cmpsel" aria-label="Compare with year"><option value="0" ${!cmpYear?"selected":""}>None</option>${CMP_YEARS.map(y => `<option value="${y}" ${y===cmpYear?"selected":""}>${esc(cmpLabel(y))}</option>`).join("")}</select></label>` : ""}
    </div>
    <div class="legend" id="legend"></div>
    <div class="chartwrap chart" id="chart"></div>
    <div class="small faint" id="chartnote"></div>
    <details class="tbl"><summary class="small"><span class="chev">›</span>Table view</summary><div class="tablewrap" id="ctable"></div></details>
    <div class="tiles" id="tiles"></div>
    <div class="sync">${S && S.updated ? `Strava synced: ${esc(new Date(S.updated).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}))}` : "Strava: not synced yet"}</div>
  </section>`;
}

function setMetric(m){
  metric = m; try { localStorage.setItem("fjm27-metric", m); } catch(e){}
  document.querySelectorAll("#metricsw button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === m));
  renderChart();
}
function setWin(v){
  win = v; try { localStorage.setItem("fjm27-win", v); } catch(e){}
  document.querySelectorAll("#winsw button").forEach(b => b.setAttribute("aria-pressed", b.dataset.w === v));
  renderChart();
}

// columns: plan index i (may be negative = pre-plan week), Monday iso, plan week or null
function chartCols(){
  if (win === "full") return W.map((w,i) => ({i, wk:w.wk, w}));
  const c = Math.max(-6, Math.min(curIdxRaw, raceWeekIdx)), a = c - 6, b = Math.min(raceWeekIdx, c + 8), out = [];
  for (let i = a; i <= b; i++) out.push({i, wk: i >= 0 && i < W.length ? W[i].wk : iso(addDays(start, 7*i)), w: i >= 0 && i < W.length ? W[i] : null});
  return out;
}

function renderChart(){
  const M = METRICS[metric];
  const host = document.getElementById("chart");
  const sw = (c, line) => line ? `<i class="sw line ref"></i>` : `<i class="sw" style="background:${c}"></i>`;
  const refOn = !!(M.ref && cmpYear && (HIST || metric !== "hours"));
  const partDefs = M.parts({}).map(p => ({k:p.k, label:p.label, c:p.c}));
  const COLS = chartCols(), N = COLS.length;
  const anyRev = COLS.some(c => c.w && c.w.revised);
  document.getElementById("legend").innerHTML =
    `<span><i class="sw" style="background:var(--band);outline:1px solid var(--band-edge)"></i>Planned range</span>` +
    (anyRev ? `<span><i class="sw revsw"></i>Revised</span>` : "") +
    partDefs.map(p => `<span>${sw(p.c)}Completed${partDefs.length > 1 ? " · " + esc(p.label) : ""}</span>`).join("") +
    `<span><i class="sw cursw"></i>Current week</span>` +
    (refOn ? `<span>${sw(null,true)}${esc(cmpLabel(cmpYear))}</span>` : "");
  document.getElementById("chartnote").textContent =
    (metric === "hours" ? "Hours = run + ski + bike (no strength, no lift skiing). " :
     metric === "vert" ? "Planned range compares to running elevation only. BC skinning is shown as a separate segment on top and isn't counted against the target. " : "Running km only. ")
    + (win === "recent" ? "Showing 6 weeks back to 8 ahead." : "");

  const Wd = Math.max(300, host.clientWidth), H = Wd < 500 ? 220 : 260;
  const m = {l:metric === "vert" ? 40 : 32, r:8, t:18, b:26};
  const iw = Wd - m.l - m.r, ih = H - m.t - m.b, bw = iw / N;
  const T = c => c.w ? weekTargets(c.w) : null;
  const tk = M.k || metric;
  const lo = c => T(c).orig[tk][0], hi = c => T(c).orig[tk][1];
  let need = 1;
  COLS.forEach(c => { if (c.w) need = Math.max(need, hi(c), T(c).rev ? T(c).rev[tk][1] : 0);
    const a = actualBy[c.wk]; if (a) need = Math.max(need, M.parts(a).reduce((s,p) => s + p.v, 0));
    if (refOn) { const r = refAt(raceWeekIdx - c.i); if (r) need = Math.max(need, M.ref(r)); } });
  const YMAX = Math.min(M.cap, Math.ceil(need * 1.05 / M.step) * M.step);
  const x = j => m.l + bw * (j + .5), y = v => m.t + ih * (1 - Math.min(v, YMAX) / YMAX);
  let g = "";
  const cj = COLS.findIndex(c => c.i === curIdxRaw);
  if (cj >= 0) g += `<rect x="${m.l + bw*cj}" y="${m.t - 4}" width="${bw}" height="${ih + 4}" fill="var(--today)" stroke="var(--today-edge)" stroke-width="1" rx="3"/>`;
  for (let v = 0; v <= YMAX + 1e-9; v += M.step) {
    g += `<line x1="${m.l}" x2="${Wd-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${m.l-6}" y="${y(v)+4}" text-anchor="end">${metric === "vert" && v >= 1000 ? (v/1000)+"k" : v}</text>`;
  }
  // x labels
  if (win === "recent") {
    const every = Wd < 500 ? 3 : 2;
    COLS.forEach((c,j) => { if ((j - Math.max(cj,0)) % every === 0) g += `<text x="${x(j)}" y="${H-8}" text-anchor="middle" ${j===cj ? 'style="fill:var(--text);font-weight:600"' : ""}>${fmt(parseD(c.wk))}</text>`; });
  } else {
    let lastM = -1;
    COLS.forEach((c,j) => { const d = parseD(c.wk), mo = d.getMonth();
      if (mo !== lastM) { lastM = mo; if (j > 0 || d.getDate() <= 7) {
        const lab = mo === 0 ? "Jan ’" + String(d.getFullYear()).slice(2) : MON[mo];
        if (!(Wd < 500 && mo % 2 === 1)) g += `<text x="${m.l + bw*j}" y="${H-8}">${lab}</text>`; }}});
  }
  // planned band over plan columns (contiguous)
  const pj = COLS.map((c,j) => c.w ? j : -1).filter(j => j >= 0);
  if (pj.length) {
    const ends = j => [j === pj[0] ? m.l + bw*j + bw*.1 : x(j), j === pj[pj.length-1] ? m.l + bw*(j+1) - bw*.1 : x(j)];
    const top = [], bot = [];
    pj.forEach(j => { const xs = pj.length === 1 ? [m.l + bw*j + bw*.1, m.l + bw*(j+1) - bw*.1] : (j === pj[0] ? [ends(j)[0], x(j)] : j === pj[pj.length-1] ? [x(j), ends(j)[1]] : [x(j)]);
      xs.forEach(xx => { top.push(`${xx},${y(hi(COLS[j]))}`); bot.push(`${xx},${y(lo(COLS[j]))}`); }); });
    g += `<polygon points="${top.concat(bot.reverse()).join(" ")}" fill="var(--band)" fill-opacity=".85" stroke="var(--band-edge)" stroke-width="1" stroke-linejoin="round"/>`;
    pj.forEach(j => { const R = T(COLS[j]).rev; if (!R) return; const [a0, a1] = R[tk];
      g += `<rect x="${m.l + bw*j + 1}" y="${y(a1)}" width="${bw - 2}" height="${Math.max(2, y(a0) - y(a1))}" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="3 2" rx="2"/>`; });
  }
  // completed: stacked bars
  const barW = Math.max(4, Math.min(16, bw * .55)), GAP = 2;
  COLS.forEach((c,j) => { const a = actualBy[c.wk]; if (!a) return;
    const parts = M.parts(a).filter(p => p.v > 0); if (!parts.length) return;
    const x0 = x(j) - barW/2; let base = 0;
    parts.forEach((p, pi) => {
      const yb = y(base) - (pi ? GAP/2 : 0), yt = y(base + p.v) + (pi < parts.length-1 ? GAP/2 : 0);
      base += p.v; if (yb - yt < .5) return;
      const r = pi === parts.length-1 ? Math.min(4, barW/2, yb - yt) : 0;
      g += r ? `<path d="M${x0},${yb} V${yt+r} Q${x0},${yt} ${x0+r},${yt} H${x0+barW-r} Q${x0+barW},${yt} ${x0+barW},${yt+r} V${yb} Z" fill="${p.c}"/>`
             : `<rect x="${x0}" y="${yt}" width="${barW}" height="${yb-yt}" fill="${p.c}"/>`;
    });
    if (base > YMAX) g += `<text x="${x(j)}" y="${m.t-6}" text-anchor="middle" style="fill:var(--text)">↑${metric==="hours"?base.toFixed(0):Math.round(base)}</text>`;
  });
  if (refOn) {
    const pts = [];
    COLS.forEach((c,j) => { const r = refAt(raceWeekIdx - c.i); if (!r) return; const v = M.ref(r); pts.push(`${x(j)},${y(v)}`);
      const pr = j ? refAt(raceWeekIdx - c.i + 1) : null;
      if (v > YMAX && !(pr && M.ref(pr) > YMAX)) g += `<text x="${x(j)}" y="${m.t-6}" text-anchor="middle" style="fill:var(--text)">↑${Math.round(v)}</text>`; });
    if (pts.length) g += `<polyline points="${pts.join(" ")}" fill="none" stroke="var(--ref)" stroke-width="2" stroke-dasharray="5 3" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  COLS.forEach((c,j) => { g += `<rect class="hit" data-j="${j}" x="${m.l + bw*j}" y="${m.t-8}" width="${bw}" height="${ih+8}" fill="transparent"/>`; });
  g += `<line id="xhair" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--text-3)" stroke-width="1" visibility="hidden"/>`;
  host.innerHTML = `<svg viewBox="0 0 ${Wd} ${H}" width="${Wd}" height="${H}" role="img" aria-label="Weekly ${esc(M.label)}: planned range, completed${refOn ? " and " + cmpYear : ""}">${g}</svg><div class="tip" id="tip"></div>`;
  const tip = host.querySelector("#tip"), xh = host.querySelector("#xhair");
  const fr = (v0, v1) => metric === "hours" ? `${v0}–${v1} h` : metric === "vert" ? `+${fM(v0)}–${fM(v1)} m` : `${v0}–${v1} km`;
  const show = j => {
    const c = COLS[j], w = c.w, a = actualBy[c.wk], r = refOn ? refAt(raceWeekIdx - c.i) : null, TT = T(c);
    const parts = a ? M.parts(a) : [], tot = parts.reduce((s,p) => s + p.v, 0);
    const note = refNote(r);
    tip.innerHTML = `<b>${w ? `Week ${w.n} · ` : ""}${fmt(parseD(c.wk))}</b><div class="faint" style="margin-bottom:4px">${w ? `${esc(w.phase)}${w.deload ? " · deload" : ""} · ${raceWeekIdx - c.i} wks to race` : "Before the plan"}</div>
      ${TT ? `<div class="r"><span class="k"><i class="sw" style="background:var(--band);outline:1px solid var(--band-edge)"></i>Planned</span><span>${fr(...TT.orig[tk])}</span></div>` : ""}
      ${TT && TT.rev ? `<div class="r"><span class="k"><i class="sw revsw"></i>Revised</span><span>${fr(...TT.rev[tk])}</span></div>` : ""}
      ${a ? parts.filter(p => p.v > 0 || parts.length === 1).map(p => `<div class="r"><span class="k">${sw(p.c)}${parts.length > 1 ? esc(p.label) : "Completed"}</span><span>${M.fmt(p.v)}</span></div>`).join("")
            + (parts.length > 1 ? `<div class="r"><span class="k">Completed</span><span><b>${M.fmt(tot)}</b></span></div>` : "")
          : `<div class="r"><span class="k">Completed</span><span>—</span></div>`}
      ${a && metric === "km" && a.longKm ? `<div class="r"><span class="k">Longest run</span><span>${num(a.longKm).toFixed(1)} km</span></div>` : ""}
      ${a && metric === "hours" && num(a.alpineH) ? `<div class="faint">+ ${fH(num(a.alpineH))} lift skiing (not counted)</div>` : ""}
      ${refOn ? `<div class="r"><span class="k">${sw(null,true)}${cmpYear}</span><span>${r ? M.fmt(M.ref(r)) : "—"}</span></div>` : ""}
      ${refOn && r ? `<div class="faint">${esc(fmtY(parseD(r.wk)))}${note ? " · " + esc(note) : ""}</div>` : ""}`;
    tip.style.display = "block";
    const cx = x(j) * (host.clientWidth / Wd || 1), hostW = host.clientWidth, tw = tip.offsetWidth;
    let left = cx + 12; if (left + tw > hostW) left = cx - tw - 12; if (left < 0) left = 0;
    tip.style.left = left + "px"; tip.style.top = "8px";
    xh.setAttribute("x1", x(j)); xh.setAttribute("x2", x(j)); xh.setAttribute("visibility", "visible");
  };
  const hide = () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); };
  host.querySelectorAll(".hit").forEach(rc => {
    rc.addEventListener("pointerenter", () => show(+rc.dataset.j));
    rc.addEventListener("click", e => { e.stopPropagation(); show(+rc.dataset.j); });
  });
  host.querySelector("svg").addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hide(); });
  renderTable();
}

function renderTable(){
  const M = METRICS[metric], defs = M.parts({}), tk = metric;
  const refOn = !!(M.ref && cmpYear && (HIST || metric !== "hours"));
  const fr = (v0, v1) => metric === "vert" ? fM(v0) + "–" + fM(v1) : v0 + "–" + v1;
  const cols = chartCols();
  document.getElementById("ctable").innerHTML = `<table><caption class="sr-only">Weekly ${esc(M.label)}, ${win === "full" ? "full plan" : "recent window"}</caption><thead><tr><th>Week</th>${defs.length > 1 ? defs.map(d => `<th>${esc(d.label)}</th>`).join("") : ""}<th>Completed</th><th>Planned</th><th>Revised</th>${refOn ? `<th>${cmpYear}</th>` : ""}</tr></thead><tbody>${cols.map(c => {
    const a = actualBy[c.wk], TT = weekTargets(c.w), ps = a ? M.parts(a) : [], tot = ps.reduce((s,p) => s + p.v, 0), r = refOn ? refAt(raceWeekIdx - c.i) : null;
    return `<tr class="${c.i === curIdxRaw ? "curwk" : ""}"><td class="num">${c.w ? "W" + c.w.n + " · " : ""}${esc(fmt(parseD(c.wk)))}</td>${defs.length > 1 ? defs.map((d,di) => `<td class="num">${a && ps[di].v ? M.fmt(ps[di].v) : "—"}</td>`).join("") : ""}<td class="num"><b>${a ? M.fmt(tot) : "—"}</b></td><td class="num">${TT ? fr(...TT.orig[tk]) : "—"}</td><td class="num">${TT && TT.rev ? fr(...TT.rev[tk]) : "—"}</td>${refOn ? `<td class="num">${r ? M.fmt(M.ref(r)) : "—"}</td>` : ""}</tr>`;
  }).join("")}</tbody></table>`;
}

function renderTiles(){
  const el = document.getElementById("tiles");
  const curMon = curIdxRaw >= 0 && curIdxRaw < W.length ? W[curIdxRaw].wk : iso(addDays(today, -todayDow));
  const synced = S && S.weeks ? S.weeks : [];
  const done = synced.filter(a => a.wk < curMon).slice(-4);                 // previous 4 COMPLETE weeks
  const planFor = wk => W.find(w => w.wk === wk);
  const evalW = done.filter(a => planFor(a.wk)).slice(-2);
  const eff = a => weekTargets(planFor(a.wk)).eff;
  const runAct = evalW.reduce((s,a) => s + num(a.runKm), 0), runPlan = evalW.reduce((s,a) => s + (eff(a).km[0] + eff(a).km[1]) / 2, 0);
  const hAct = evalW.reduce((s,a) => s + totH(a), 0), hLo = evalW.reduce((s,a) => s + eff(a).hours[0], 0);
  const runPct = runPlan ? Math.round(runAct / runPlan * 100) : null;
  const lastDone = evalW[evalW.length-1];
  const prevLong = done.filter(a => !lastDone || a.wk < lastDone.wk).reduce((m,a) => Math.max(m, num(a.longKm)), 0);
  const longJump = lastDone && prevLong ? num(lastDone.longKm) - prevLong : 0;
  let st;
  if (!S || !S.weeks) st = {cls:"info", label:"No data yet", sub:"Waiting for a Strava sync"};
  else if (runPct === null) st = {cls:"info", label:"Building up", sub:"Status starts after the first complete plan week"};
  else if (runPct > 120 || longJump > 2.5) st = {cls:"warning", label:"Ahead — careful", sub: runPct > 120 ? `Run ${runPct}% of target — hold back, injuries come from here` : `Long run jumped +${longJump.toFixed(1)} km — next week easy`};
  else if (runPct >= 80) st = {cls:"good", label:"On track", sub:`Run ${runPct}% of target · ${fH(hAct/evalW.length)} h/wk total`};
  else if (hAct >= hLo) st = {cls:"warning", label:"Aerobic on track, run volume low", sub:`Run ${runPct}% · hours OK via ski/bike — keep Fri hills + Sun long run as runs`};
  else st = {cls:"serious", label:"Behind", sub:`Run ${runPct}% of target, hours below range — protect Fri hills + Sun long run`};

  const cw = W[curIdx], ca = actualBy[cw.wk];
  const longest = done.reduce((m,a) => Math.max(m, num(a.longKm)), 0);
  const tot = done.reduce((s,a) => s + num(a.runKm), 0);
  const withPlan = done.filter(a => planFor(a.wk));
  const hParts = ca ? TYPES.filter(t => t.h(ca) > 0) : [];
  const span = done.length ? `${fmt(parseD(done[0].wk))} – ${fmt(addDays(parseD(done[done.length-1].wk), 6))}` : "";
  const tile = (l, v, sub) => `<div class="tile"><div class="l">${l}</div><div class="v">${v}</div><div class="sub">${sub}</div></div>`;
  const r = cmpYear ? refAt(raceWeekIdx - curIdx) : null;
  el.innerHTML = [
    `<div class="tile wide"><div class="l">Status · last complete plan weeks</div><div class="v"><span class="status">${ICON[st.cls]}${esc(st.label)}</span></div><div class="sub">${esc(st.sub)}</div></div>`,
    tile("Running · prev. 4 complete weeks", done.length ? `${tot.toFixed(0)} km` : "—", (withPlan.length ? `Planned ${withPlan.reduce((s,a)=>s+planFor(a.wk).kmLo,0)}–${withPlan.reduce((s,a)=>s+planFor(a.wk).kmHi,0)} km · ` : "Mostly before plan start · ") + esc(span)),
    tile("Longest run · prev. 4 complete weeks", done.length ? `${longest.toFixed(1)} km` : "—", ca && num(ca.longKm) ? `This week so far: ${num(ca.longKm).toFixed(1)} km` : esc(span)),
    `<div class="tile"><div class="l">Time by type · this week</div><div class="v">${fH(totH(ca))} h</div><div class="sub">${hParts.length ? `<div class="hbreak">${hParts.map(t => `<span><i class="sw" style="background:${t.c}"></i>${t.label} ${fH(t.h(ca))}</span>`).join("")}</div>` : "Nothing logged yet"}</div></div>`,
    cmpYear ? tile(`${cmpYear} · same weeks-to-race`, r ? `${num(r.runKm).toFixed(0)} km` : "—", r ? `+${fM(num(r.runElev))} m · ${fH(totH(r))} h` : "No data that week") : ""
  ].join("");
}

/* ---------- course ---------- */
const C = D.course && D.course.profile && D.course.sections ? D.course : null;
const KIND = {climb:"Climb", descent:"Descent", rolling:"Rolling"};
const KSYM = {climb:"▲", descent:"▼", rolling:"≈"};
const GRADE_ORDER = ["<-15%","-15..-8","-8..-3","-3..3","3..8","8..15",">15%"];
const GRADE_COL = ["var(--dv-d3)","var(--dv-d2)","var(--dv-d1)","var(--dv-0)","var(--dv-u1)","var(--dv-u2)","var(--dv-u3)"];
const fClock = s => { const m = Math.round(s/60); return Math.floor(m/60) + ":" + String(m%60).padStart(2,"0"); };
const secAt = km => C.sections.find(s => km >= s.fromKm && km <= s.toKm) || C.sections[C.sections.length-1];
const clockAt = km => { const i = C.sections.indexOf(secAt(km)), s = C.sections[i], t0 = i ? C.sections[i-1].clockAt : 0;
  return t0 + (s.clockAt - t0) * Math.max(0, Math.min(1, (km - s.fromKm) / ((s.toKm - s.fromKm) || 1))); };
const eleAt = km => { const P2 = C.profile; let j = P2.findIndex(p => p[0] >= km); if (j <= 0) return P2[Math.max(0,j)][1]; if (j < 0) return P2[P2.length-1][1];
  const [k0,e0] = P2[j-1], [k1,e1] = P2[j]; return e0 + (e1 - e0) * (km - k0) / ((k1 - k0) || 1); };

function courseCard(){
  if (!C) return "";
  const gTot = GRADE_ORDER.reduce((s,k) => s + (C.grades[k] || 0), 0) || 1;
  return `<section class="card" id="coursecard"><div class="spread"><h2>Course</h2><span class="small muted">${C.km.toFixed(1)} km · +${fM(C.up)} / −${fM(C.down)} m</span></div>
    <p class="small muted" style="margin:-6px 0 8px">2026 course, assumed for 2027. Target clock for ${esc(C.targetTotal)} shown per section.</p>
    <div class="legend"><span><i class="sw" style="background:var(--series-1)"></i>Elevation</span><span><i class="sw" style="background:var(--sec-climb);outline:1px solid var(--band-edge)"></i>▲ Climb</span><span><i class="sw" style="background:var(--sec-descent);outline:1px solid var(--band-edge)"></i>▼ Descent</span><span><i class="sw" style="background:var(--sec-rolling);outline:1px solid var(--band-edge)"></i>≈ Rolling</span>${C.aid ? `<span><i class="aidsw"></i>Aid station</span>` : ""}</div>
    <div class="chartwrap chart" id="cchart"></div>
    ${C.aid ? `<div class="aidrow">${C.aid.map((a,i) => { const prev = i ? C.aid[i-1].km : 0; return `<div class="aid"><b>${esc(a.label)} ${esc(a.name)}</b><span class="small muted">${esc(a.services)} · ${(a.km - prev).toFixed(0)} km since ${i ? esc(C.aid[i-1].label) : "start"}</span><span class="small">Target <b>${esc(a.clock)}</b></span></div>`; }).join("")}</div>
    <p class="small" style="margin:6px 0 10px"><b>First aid station is at 22K</b> (~${esc(C.aid[0].clock)} at target pace): carry fluids and fuel for the whole first half, and practise that on long runs.</p>` : ""}
    <div class="gbar" role="img" aria-label="Distance by gradient">${GRADE_ORDER.map((k,i) => C.grades[k] ? `<span style="flex:${C.grades[k]};background:${GRADE_COL[i]}" title="${esc(k)}: ${C.grades[k]} km"></span>` : "").join("")}</div>
    <div class="glabels">${GRADE_ORDER.map((k,i) => C.grades[k] ? `<span><i class="sw" style="background:${GRADE_COL[i]}"></i>${esc(k.replace("..","…"))}${/%/.test(k) ? "" : "%"} <b>${C.grades[k].toFixed(1)}</b> km</span>` : "").join("")}</div>
    <div class="secblocks">${C.sections.map((s,i) => `<div class="secb"><div class="secb-h"><span class="secno k-${esc(s.kind)}">${i+1}</span><span class="num">km ${s.fromKm.toFixed(1)}–${s.toKm.toFixed(1)}</span><span class="num secb-clock">at <b>${esc(s.clock)}</b></span></div><div><b>${esc(s.name)}</b> <span class="faint small">${KSYM[s.kind] || ""} ${esc(KIND[s.kind] || s.kind)} · +${fM(s.up)} / −${fM(s.down)} m</span></div><div class="small">${esc(s.demand)}</div><div class="small muted">Train it with: ${esc(s.training)}</div></div>`).join("")}</div>
    <div class="tablewrap ctabwrap" style="margin-top:12px"><table class="ctab"><thead><tr><th>#</th><th>km</th><th>Section</th><th>+/− m</th><th>Clock</th></tr></thead><tbody>${C.sections.map((s,i) => `
      <tr><td class="num"><span class="secno k-${esc(s.kind)}">${i+1}</span></td><td class="num">${s.fromKm.toFixed(1)}–${s.toKm.toFixed(1)}</td><td><b>${esc(s.name)}</b> <span class="faint small">${KSYM[s.kind] || ""} ${esc(KIND[s.kind] || s.kind)}</span><div class="small">${esc(s.demand)}</div><div class="small muted">Train it with: ${esc(s.training)}</div></td><td class="num">+${fM(s.up)}<br>−${fM(s.down)}</td><td class="num"><b>${esc(s.clock)}</b></td></tr>`).join("")}</tbody></table></div>
    <p class="small faint" style="margin:8px 0 0">${esc(C.splitNote)}</p>
  </section>`;
}

function aidLine(km){
  if (!C.aid) return "";
  const at = C.aid.find(a => Math.abs(a.km - km) < 0.3);
  if (at) return `<div class="r"><span class="k">Aid station</span><span><b>${esc(at.label)} ${esc(at.name)}</b></span></div>`;
  const nx = C.aid.find(a => a.km > km);
  return nx ? `<div class="r"><span class="k">Next aid</span><span>${esc(nx.label)} in ${(nx.km - km).toFixed(1)} km</span></div>` : `<div class="r"><span class="k">Next aid</span><span>Finish in ${(C.km - km).toFixed(1)} km</span></div>`;
}
function renderCourse(){
  const host = document.getElementById("cchart"); if (!host || !C) return;
  const Wd = Math.max(300, host.clientWidth), CH = Wd < 500 ? 200 : 240, m = {l:38, r:8, t:22, b:24};
  const iw = Wd - m.l - m.r, ih = CH - m.t - m.b;
  const y0 = Math.floor(C.minEle / 100) * 100 - 100, y1 = Math.ceil(C.maxEle / 100) * 100 + 50;
  const x = km => m.l + iw * km / C.km, y = e => m.t + ih * (1 - (e - y0) / (y1 - y0));
  let g = "";
  C.sections.forEach((s,i) => {
    g += `<rect x="${x(s.fromKm)}" y="${m.t}" width="${x(s.toKm) - x(s.fromKm)}" height="${ih}" fill="var(--sec-${s.kind})"/>`;
    g += `<line x1="${x(s.fromKm)}" x2="${x(s.fromKm)}" y1="${m.t}" y2="${m.t+ih+4}" stroke="var(--band-edge)" stroke-width="1"/>`;
    g += `<text x="${(x(s.fromKm)+x(s.toKm))/2}" y="${m.t+12}" text-anchor="middle" style="fill:var(--text-2);font-weight:600">${i+1}</text><text x="${(x(s.fromKm)+x(s.toKm))/2}" y="${m.t+25}" text-anchor="middle" style="fill:var(--text-2)">${KSYM[s.kind] || ""}</text>`;
  });
  for (let e = Math.ceil(y0/200)*200; e <= y1; e += 200) {
    g += `<line x1="${m.l}" x2="${Wd-m.r}" y1="${y(e)}" y2="${y(e)}" stroke="var(--grid)" stroke-width="1" opacity=".8"/>`;
    g += `<text x="${m.l-6}" y="${y(e)+4}" text-anchor="end">${e}</text>`;
  }
  const kStep = Wd < 500 ? 10 : 5, kLast = Math.floor(C.km / kStep) * kStep;
  for (let k = 0; k <= C.km; k += kStep) g += k === kLast
    ? `<text x="${x(k)}" y="${CH-6}" text-anchor="middle">${k} km</text>`
    : `<text x="${x(k)}" y="${CH-6}" text-anchor="middle">${k}</text>`;
  const line = C.profile.map(p => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  g += `<polygon points="${x(0)},${y(y0)} ${line} ${x(C.km)},${y(y0)}" fill="var(--series-1)" opacity=".18"/>`;
  g += `<polyline points="${line}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round"/>`;
  const hx = x(C.maxKm), hy = y(C.maxEle);

  const svg = host.querySelector("svg"), tip = host.querySelector("#ctip"), cx = host.querySelector("#cx"), cd = host.querySelector("#cdot");
  const show = ev => {
    const r = svg.getBoundingClientRect(), sx = r.width ? (ev.clientX - r.left) * Wd / r.width : 0;

  document.addEventListener("click", () => { tip.style.display = "none"; cx.setAttribute("visibility","hidden"); cd.setAttribute("visibility","hidden"); });
}

function renderHistChart(){
  const host = document.getElementById("hchart"); if (!host) return;
  const M = METRICS[hmetric], defs = M.parts({});
  document.getElementById("hlegend").innerHTML = defs.map(p => `<span><i class="sw" style="background:${p.c}"></i>${esc(p.label)}</span>`).join("");
  const Wd = Math.max(300, host.clientWidth), H2 = 200, m = {l: hmetric === "km" ? 38 : 42, r:8, t:14, b:24};
  const iw = Wd - m.l - m.r, ih = H2 - m.t - m.b, N = YEARS.length, bw = iw / N;
  const tot = t => M.parts(t).reduce((s,p) => s + p.v, 0);
  const mx = Math.max(1, ...YEARS.map(tot));
  const step = (() => { const raw = mx / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); return [1,2,2.5,5,10].map(f => f*p).find(s => s >= raw); })();
  const YMAX = Math.ceil(mx / step) * step;
  const y = v => m.t + ih * (1 - v / YMAX), x = i => m.l + bw * (i + .5);
  let g = "";
  for (let v = 0; v <= YMAX + 1e-9; v += step) {
    g += `<line x1="${m.l}" x2="${Wd-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/>`;
    g += `<text x="${m.l-6}" y="${y(v)+4}" text-anchor="end">${v >= 1000 ? (v/1000) + "k" : v}</text>`;
  }
  const barW = Math.max(6, Math.min(36, bw * .6)), GAP = 2;
  YEARS.forEach((t,i) => {
    const parts = M.parts(t).filter(p => p.v > 0), x0 = x(i) - barW/2; let base = 0;
    parts.forEach((p, pi) => {
      const yb = y(base) - (pi ? GAP/2 : 0), yt = y(base + p.v) + (pi < parts.length-1 ? GAP/2 : 0); base += p.v; if (yb - yt < .5) return;
      const r = pi === parts.length-1 ? Math.min(4, barW/2, yb - yt) : 0;
      g += r ? `<path d="M${x0},${yb} V${yt+r} Q${x0},${yt} ${x0+r},${yt} H${x0+barW-r} Q${x0+barW},${yt} ${x0+barW},${yt+r} V${yb} Z" fill="${p.c}"/>` : `<rect x="${x0}" y="${yt}" width="${barW}" height="${yb-yt}" fill="${p.c}"/>`;
    });
    if (t.y === YTD_YEAR) g += `<rect x="${x0}" y="${m.t}" width="${barW}" height="${ih}" fill="none" stroke="var(--band-edge)" stroke-dasharray="3 3"/>`;
    g += `<text x="${x(i)}" y="${H2-6}" text-anchor="middle">${Wd < 500 ? "’" + String(t.y).slice(2) : t.y}</text>`;
    g += `<rect class="hhit" data-i="${i}" x="${m.l + bw*i}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"/>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${Wd} ${H2}" width="${Wd}" height="${H2}" role="img" aria-label="Yearly ${esc(M.label)}">${g}</svg><div class="tip" id="htip"></div>`;
  const tip = host.querySelector("#htip");
  host.querySelectorAll(".hhit").forEach(rc => { const show = e => { e.stopPropagation(); const t = YEARS[+rc.dataset.i], ps = M.parts(t);
    const f = RACES.find(r => isFjm45(r) && r.date.slice(0,4) === String(t.y));
    tip.innerHTML = `<b>${t.y}${t.y === YTD_YEAR ? " (YTD)" : ""}</b>` + ps.map(p => `<div class="r"><span class="k"><i class="sw" style="background:${p.c}"></i>${esc(p.label)}</span><span>${M.fmt(p.v)}</span></div>`).join("")
      + (ps.length > 1 ? `<div class="r"><span class="k">Total</span><span><b>${M.fmt(tot(t))}</b></span></div>` : "")
      + (f ? `<div class="faint" style="margin-top:4px">FJM 45k ${esc(f.moving)}</div>` : "");
    tip.style.display = "block"; const cx = x(+rc.dataset.i), tw = tip.offsetWidth; let left = cx + 12; if (left + tw > host.clientWidth) left = cx - tw - 12; tip.style.left = Math.max(0,left) + "px"; tip.style.top = "6px"; };
    rc.addEventListener("pointerenter", show); rc.addEventListener("click", show); });
  host.querySelector("svg").addEventListener("pointerleave", e => { if (e.pointerType === "mouse") tip.style.display = "none"; });
  document.addEventListener("click", () => { tip.style.display = "none"; });
}

(function(){

    const ws = W.filter(x => x.phase === p.name), n0 = ws[0] ? ws[0].n : 0, n1 = ws.length ? ws[ws.length-1].n : 0;

  function hide(){ if (pinned !== null) return; tip.style.display = "none"; bar.classList.remove("hov"); }

    const i = +h.dataset.ph;
    h.addEventListener("mouseenter", () => { if (pinned === null) show(i, h); });

  document.addEventListener("click", () => { if (pinned !== null) { pinned = null; hide(); } });
})();

document.getElementById("themebtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("fjm27-theme", root.dataset.theme); } catch(e){}
